# Hermes VM Shadow Deploy — Phase 11 (provider-neutral Ubuntu + Docker Compose).
#
# SHADOW MODE ONLY. Every service runs with BROKER_MODE=none and all submission
# flags false (enforced by config.AppConfig and by services.shadow_cycle). No
# broker credentials are present. The default env file is the committed,
# secret-free template so `docker compose config` works before a VM exists. On a
# droplet, point HERMES_VM_SHADOW_ENV_FILE at the chmod-600 host copy in
# /opt/hermes/secrets/.
#
# This file is repo-side scaffolding. It does not provision a VM and does not run
# until an operator deploys it deliberately.

x-hermes-image: &hermes-image
  build:
    context: ..
    dockerfile: infra/Dockerfile
  image: hermes-shadow:local
  env_file:
    - ${HERMES_VM_SHADOW_ENV_FILE:-hermes.vm_shadow.env.example}
  volumes:
    - /opt/hermes/data:/opt/hermes/data
    - /opt/hermes/logs:/opt/hermes/logs
  restart: unless-stopped

services:
  # SQLite has no server process. This init container only ensures the shared
  # data/log directories exist and are writable, then exits 0. The other services
  # wait for it. A real database server (e.g. Postgres) is a deliberate later
  # decision, intentionally out of scope for the first shadow deploy.
  hermes-db:
    <<: *hermes-image
    restart: "no"
    command:
      - python
      - -c
      - "import os; [os.makedirs(p, exist_ok=True) for p in ('/opt/hermes/data', '/opt/hermes/logs')]; print('hermes-db: shared volumes ready')"

  # The shadow application loop: one deterministic cycle (config gate -> startup
  # audit -> read-only pipeline -> heartbeat) per interval. No submission path.
  hermes-app:
    <<: *hermes-image
    depends_on:
      hermes-db:
        condition: service_completed_successfully
    command: ["bash", "infra/deploy/run_shadow_loop.sh"]
    healthcheck:
      test: ["CMD", "python", "infra/deploy/heartbeat_age.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Phase 11 placeholder. There is no background workload yet (no Temporal, no
  # scheduler) and no submission path. Real worker logic lands in a later phase.
  hermes-worker:
    <<: *hermes-image
    depends_on:
      hermes-db:
        condition: service_completed_successfully
    command:
      - python
      - -c
      - "import time; print('hermes-worker: Phase 11 placeholder, no workload', flush=True); time.sleep(2**31)"

  # Periodically exports the append-only audit log to JSONL for off-box review.
  hermes-reporter:
    <<: *hermes-image
    depends_on:
      hermes-db:
        condition: service_completed_successfully
    command: ["bash", "infra/deploy/run_reporter_loop.sh"]
