[project]
name = "hermes-personal-options"
version = "0.1.0"
description = "Deterministic safety boundary and gateway schemas for Hermes Personal Account."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# World-A-only research/proposal harness (roadmap Phase 14). NOT a runtime dependency:
# the deterministic Hermes runtime and the test suite never import these. Installed only
# on a local dev workbench or a separated World-A agent surface, never inside the
# deterministic runtime process/container and never beside broker credentials
# (docs/CLAUDE_AGENT_SDK_INTEGRATION.md §1, §5). Version floors are conservative and
# should be confirmed when the World-A workbench is provisioned.
agents = [
    "claude-agent-sdk>=0.1.0",
    "pydantic-ai>=0.1.0",
]
# Agent OS read-only relay (ops/api.py, Agent OS Phase 6). Observe-only HTTP surface;
# not required by the deterministic decision pipeline.
relay = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14.0",
    "pyright>=1.1.407",
    # httpx backs fastapi.testclient for the relay rejection-first tests.
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast deterministic unit tests",
    "integration: integration tests that combine multiple subsystems",
    "broker: broker adapter or broker API tests; must not hit live broker services unless explicitly configured",
    "paper: paper-trading tests and drills",
    "slow: slower tests excluded from tight local loops unless explicitly selected",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    ".venv",
    "archive",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "brokers", "config", "data", "gateway", "ops", "replay", "reports", "schemas", "services", "storage", "strategies"]
